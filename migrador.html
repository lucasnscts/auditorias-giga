<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrador de Dados - GIGA</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SDK do Supabase (Origem) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- SDKs do Firebase (Destino) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-6">
    <div class="bg-white p-8 rounded-xl shadow-xl max-w-md w-full text-center space-y-6">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-3xl">
            <i class="fa-solid fa-database"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">Migração de Dados</h1>
        <p class="text-sm text-slate-500">Transfere as auditorias antigas do Supabase para o novo Firebase.</p>
        
        <div class="bg-amber-50 border border-amber-200 p-3 rounded text-xs text-amber-800 text-left">
            <strong>Atenção:</strong> Execute isto usando os dados móveis (4G) ou na sua rede de casa. Não use o Wi-Fi da empresa, pois o Supabase está bloqueado lá.
        </div>

        <button id="btn-migrar" onclick="iniciarMigracao()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition-all">
            Iniciar Importação
        </button>

        <p id="status-text" class="text-sm font-semibold text-slate-700 h-8"></p>
    </div>

    <script>
        // 1. Conexão Supabase (Origem)
        const SUPABASE_URL = 'https://fzdiuvtbcfyistnddann.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_McSJpQ5YJWOY9h3zJBH2Gg_JaFI0lda'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. Conexão Firebase (Destino)
        const firebaseConfig = {
            apiKey: "AIzaSyDdczFH9ulFnkXRpaFcXV2zYJ5YJBh-bng",
            authDomain: "auditorias-giga.firebaseapp.com",
            projectId: "auditorias-giga",
            storageBucket: "auditorias-giga.firebasestorage.app",
            messagingSenderId: "754672057943",
            appId: "1:754672057943:web:c06d9eeae758e8377d2d12"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Converte a data do formato string (DD/MM/YYYY) para timestamp numérico
        function converterParaTimestamp(dataStr) {
            if (!dataStr) return Date.now();
            try {
                let partes = dataStr.split(/[\s,]+/); 
                let dataParts = partes[0].split('/');
                let horaParts = partes[1] ? partes[1].split(':') : [0,0,0];
                return new Date(dataParts[2], dataParts[1] - 1, dataParts[0], horaParts[0], horaParts[1], horaParts[2] || 0).getTime();
            } catch(e) {
                return Date.now();
            }
        }

        async function iniciarMigracao() {
            const btn = document.getElementById('btn-migrar');
            const status = document.getElementById('status-text');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.innerText = "Conectando ao Supabase...";

            try {
                // Busca tudo do Supabase
                const { data: registros, error } = await supabaseClient.from('auditorias_giga').select('*');
                
                if (error) throw new Error("Erro ao ler Supabase: " + error.message);
                if (!registros || registros.length === 0) {
                    status.innerText = "Nenhum registro encontrado no Supabase.";
                    return;
                }

                status.innerText = `Encontrados ${registros.length} registros. Enviando para Firebase...`;
                
                let count = 0;
                for (const reg of registros) {
                    // Prepara o pacote removendo o ID do Supabase para o Firebase criar o seu próprio
                    let payload = { ...reg };
                    delete payload.id;
                    
                    // Adiciona o timestamp para manter a ordenação correta no Dashboard do Firebase
                    payload.timestamp = converterParaTimestamp(payload.data_auditoria);

                    await db.collection('auditorias_giga').add(payload);
                    count++;
                    status.innerText = `Copiando: ${count} de ${registros.length}...`;
                }

                status.innerHTML = `<span class="text-emerald-600">Migração concluída! ${count} registros transferidos.</span>`;
                alert("Importação finalizada com sucesso! Pode fechar esta página e conferir no seu aplicativo principal.");

            } catch (err) {
                console.error(err);
                status.innerHTML = `<span class="text-rose-600">Falha: ${err.message}</span>`;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
